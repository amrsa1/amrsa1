name: Refresh project cards

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-project-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch metrics and render cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh-project-cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-cards
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh project stars, forks and npm downloads"
          git pull --rebase origin main
          git push origin HEAD:main
